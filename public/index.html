<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiosk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { height: 100vh; display: flex; flex-direction: column; font-family: sans-serif; background: #f5f5f5; }
    #waiting {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 2rem;
      color: #333;
    }
    #frame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="waiting">Ready for member</div>
  <iframe id="frame"></iframe>
  <script>
    const waiting = document.getElementById('waiting')
    const frame = document.getElementById('frame')
    const ws = new WebSocket('ws://192.168.168.77:8001')

    let signingActive = false

    function reset() {
      signingActive = false
      frame.style.display = 'none'
      frame.src = ''
      waiting.style.display = 'flex'
    }

    frame.addEventListener('load', () => {
      if (signingActive) {
        reset()
      } else {
        signingActive = true
      }
    })

    ws.onopen = () => console.log('Connected to broker')
    ws.onmessage = ({ data }) => {
      const msg = JSON.parse(data)
      if (msg.type === 'sign') {
        signingActive = false
        frame.src = msg.url
        frame.style.display = 'block'
        waiting.style.display = 'none'
      }
    }
  </script>
</body>
</html>
