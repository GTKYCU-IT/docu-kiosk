name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Tag Docker image with version
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }} \
            ghcr.io/${{ github.repository }}:latest

      - name: Extract extension from image
        run: |
          id=$(docker create ghcr.io/${{ github.repository }}:latest)
          docker cp $id:/app/extension/public/docu-kiosk.crx ./docu-kiosk.crx
          docker cp $id:/app/extension/public/update.xml ./update.xml
          docker rm $id

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            docu-kiosk.crx
            update.xml
