name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  release:
    needs: [go-test, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - name: Extract version and image name
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "image=$image" >> $GITHUB_OUTPUT
          if [[ "$version" == *-* ]]; then
            # Prerelease (e.g. 2.2.8-rc.1): never touch :latest.
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$image:$version" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "tags<<EOF" >> $GITHUB_OUTPUT
            echo "$image:$version" >> $GITHUB_OUTPUT
            echo "$image:latest" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
      - name: Write signing key
        run: echo "${{ secrets.DIST_PEM_B64 }}" | base64 -d > dist.pem
        working-directory: extension
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
      - name: Pack signed CRX (stable only — Chrome requires numeric version)
        if: steps.version.outputs.prerelease == 'false'
        run: npm run pack
        working-directory: extension
      - name: Prerelease note (CRX skipped)
        if: steps.version.outputs.prerelease == 'true'
        run: |
          echo "Prerelease — CRX pack skipped (Chrome manifest version can't contain '-'." >> $GITHUB_STEP_SUMMARY
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.tags }}
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.prerelease == 'false'
        with:
          prerelease: false
          files: |
            extension/public/docu-kiosk.crx
            extension/public/update.xml
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.prerelease == 'true'
        with:
          prerelease: true