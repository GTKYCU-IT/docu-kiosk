services:
  app:
    image: ghcr.io/calvertjadon/docu-kiosk:latest
    env_file: .env
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file: .env
    restart: unless-stopped
    depends_on:
      - app

volumes:
  caddy-data:
  caddy-config:
