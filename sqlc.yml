version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/queries"
    schema: "sql/migrations"
    gen:
      go:
        package: "database"
        out: "internal/database"
        rename:
          id: ID
          ip: IP
        overrides:
          - column: "kiosks.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "users.id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "refresh_tokens.user_id"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "refresh_tokens.created_at"
            nullable: false
            go_type: "time.Time"
          - column: "refresh_tokens.updated_at"
            nullable: false
            go_type: "time.Time"
          - column: "refresh_tokens.expires_at"
            nullable: false
            go_type: "time.Time"
          - column: "refresh_tokens.revoked_at"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
